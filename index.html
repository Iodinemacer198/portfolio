<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body, html { 
            margin: 0; padding: 0;
            width: 100%; height: 100%; min-height: 100vh;
            background: linear-gradient(rgba(109, 109, 109, 0.4), rgba(45, 45, 45, 0.4));
            background-size: cover; background-color: #000;
            color: #fff; font-family: 'Verdana', sans-serif;
            overflow-x: hidden; display: flex; flex-direction: column;
        }

        .timeline {
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding-bottom: 60px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding: 25px;
            background: rgba(80, 79, 79, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(68, 68, 68, 0.08);
            box-shadow: 0 0 20px rgba(74, 74, 74, 0.2);
            opacity: 1;
        }

        .card:nth-child(even) {
            flex-direction: row-reverse;
        }

        .card img {
            width: 260px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .info {
            flex: 1;
        }

        .info h2 {
            color: #63b3ed;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-size: 20pt;
        }

        .info p {
            line-height: 1.6;
            color: #dddddd;
            letter-spacing: 1px;
            font-size: 14pt;
        }

        .social-container {
            display: flex;
            justify-content: center; 
            gap: 20px;
            margin-bottom: 50px;
        }

        .social-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #333333;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .social-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

    </style>
</head>

<body>
    <h1 style="color: white; text-align: center; margin-top: 50px; font-size: 48px; margin-bottom: 30px">Iodinemacer's Portfolio</h1>

    <div class="social-container">
        <a href="https://www.linkedin.com/in/tyler-molina-1a4b63429/" class="social-icon" aria-label="Linkedin">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f8/LinkedIn_icon_circle.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Linkedin Icon">
        </a>

        <a href="https://www.instagram.com/tylermolina508/" target="_blank" class="social-icon instagram" aria-label="Instagram">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram Icon">
        </a>

        <a href="https://discord.com/users/1140696859107659937" target="_blank" class="social-icon discord" aria-label="Discord">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Discord_color_D.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Discord Icon">
        </a>
    </div>

    <div class="timeline">
        <div class="card">
            <img src="https://picsum.photos/600/400?random=5" alt="Engineering Builds">
            <div class="info">
                <h2>Engineering Builds</h2>
                <p>Projects that followed the full engineering process, from computer design to physical construction.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/600/400?random=2" alt="Coding Projects">
            <div class="info">
                <h2>Coding Projects</h2>
                <p>Coding projects that cover a wide variety of languages and disciplines.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/600/400?random=1" alt="CAD Projects">
            <div class="info">
                <h2>CAD Projects</h2>
                <p>Projects modeled designed in CAD software.</p>
            </div>
        </div>
    </div>

</body>
</html>
